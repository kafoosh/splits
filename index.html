<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#0b0b0b">
  <title>Splits</title>
  <style>
    :root {
      --bg: #0b0b0b;
      --hint: #7c7c7c;
      --gold: #efc462;
      --red: #e0323c;
      --gap: 4px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%;
      overflow: hidden;
      overscroll-behavior: none;
      background: var(--bg);
      touch-action: none;
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", system-ui, sans-serif;
    }
    body {
      display: grid;
      place-items: center;
      height: 100dvh;
    }

    #stage {
      position: relative;
      width: 100vw;
      display: flex;
      flex-direction: column;
      gap: var(--gap);
      background: var(--bg);
    }
    /* Secret cue when the force is toggled: the split line glows faintly once. */
    #stage.cue { animation: cue .6s ease-out; }
    @keyframes cue { 25% { background: #3c3c3c; } }
    .half {
      position: relative;
      background: var(--bg);
      width: 100%;
      overflow: hidden;
      touch-action: none;
      cursor: grab;
    }
    .half:active { cursor: grabbing; }
    .card {
      position: absolute;
      top: 0;
      left: 0;
      background-repeat: no-repeat;
      will-change: transform, opacity;
      pointer-events: none;
    }
    .top .card    { background-position: 50% 0;    transform-origin: 50% 100%; }
    .bottom .card { background-position: 50% 100%; transform-origin: 50% 0; }

    /* Swipe guides */
    .guide {
      position: absolute;
      left: 50%;
      width: 132px;
      height: 28px;
      margin-left: -66px;
      color: var(--hint);
      pointer-events: none;
      transition: opacity .5s ease;
    }
    .guide.gone { opacity: 0; }
    .guide.top-guide    { top: -52px; }
    .guide.bottom-guide { bottom: -52px; }
    .guide svg { width: 100%; height: 100%; overflow: visible; }
    .guide .chev { fill: none; stroke: currentColor; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
    .guide .chev.l { animation: nudgeL 1.6s ease-in-out infinite; }
    .guide .chev.r { animation: nudgeR 1.6s ease-in-out infinite; }
    .guide .dot { fill: currentColor; animation: slide 1.6s ease-in-out infinite; }
    @keyframes slide {
      0%, 100% { transform: translateX(-26px); }
      50%      { transform: translateX(26px); }
    }
    @keyframes nudgeL {
      0%, 100% { transform: translateX(-5px); opacity: 1; }
      50%      { transform: translateX(0);    opacity: .45; }
    }
    @keyframes nudgeR {
      0%, 100% { transform: translateX(0);   opacity: .45; }
      50%      { transform: translateX(5px); opacity: 1; }
    }

    /* Result flash */
    #flash {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%) scale(.6);
      opacity: 0;
      pointer-events: none;
      display: grid;
      place-items: center;
      background: rgba(11, 11, 11, .88);
      border-radius: 999px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, .45);
    }
    #flash.match {
      padding: .45em 1.1em;
      font-size: clamp(34px, 11vw, 60px);
      font-weight: 800;
      letter-spacing: -.01em;
      color: var(--gold);
    }
    #flash.miss {
      width: clamp(96px, 28vw, 140px);
      height: clamp(96px, 28vw, 140px);
      color: var(--red);
    }
    #flash.miss svg { width: 52%; height: 52%; }
    #flash.miss path { fill: none; stroke: currentColor; stroke-width: 7; stroke-linecap: round; }
    #flash.show { animation: pop 1.15s cubic-bezier(.2, .9, .3, 1.2) forwards; }
    @keyframes pop {
      0%   { opacity: 0; transform: translate(-50%, -50%) scale(.6); }
      16%  { opacity: 1; transform: translate(-50%, -50%) scale(1.06); }
      28%  { transform: translate(-50%, -50%) scale(1); }
      75%  { opacity: 1; transform: translate(-50%, -50%) scale(1); }
      100% { opacity: 0; transform: translate(-50%, -50%) scale(.94); }
    }

    @media (prefers-reduced-motion: reduce) {
      .guide .chev, .guide .dot { animation: none; }
    }
  </style>
</head>
<body>
  <main id="stage">
    <div class="half top" data-half="top" aria-label="Top half"></div>
    <div class="half bottom" data-half="bottom" aria-label="Bottom half"></div>

    <div class="guide top-guide" aria-hidden="true">
      <svg viewBox="0 0 132 28">
        <path class="chev l" d="M14 4 4 14l10 10" />
        <circle class="dot" cx="66" cy="14" r="5" />
        <path class="chev r" d="M118 4l10 10-10 10" />
      </svg>
    </div>
    <div class="guide bottom-guide" aria-hidden="true">
      <svg viewBox="0 0 132 28">
        <path class="chev l" d="M14 4 4 14l10 10" />
        <circle class="dot" cx="66" cy="14" r="5" />
        <path class="chev r" d="M118 4l10 10-10 10" />
      </svg>
    </div>

    <div id="flash" role="status" aria-live="polite"></div>
  </main>

  <script>
  (() => {
    const RANKS = ['ace', '2', '3', '4', '5', '6', '7', '8', '9', '10', 'jack', 'queen', 'king'];
    const SUITS = ['spades', 'hearts', 'diamonds', 'clubs'];
    const ALL = SUITS.flatMap(s => RANKS.map(r => `${r}_of_${s}`));
    const src = name => `cards/${name}.webp`;

    // The two forced cards. Each half alternates between them, never both on the same one.
    const FORCE = ['9_of_diamonds', 'king_of_clubs'];
    const isForce = c => FORCE.includes(c);
    const otherForce = c => (c === FORCE[0] ? FORCE[1] : FORCE[0]);

    // Preload every face so the carousel never shows a blank card.
    ALL.forEach(n => { const i = new Image(); i.src = src(n); });

    // Physics tuning
    const FLING = 650;       // ms: how far a fling carries (distance = velocity × FLING)
    const POWER = 3;         // ease-out power; initial animation speed matches release speed
    const MIN_DUR = 280, MAX_DUR = 2600;
    const TAP_PX = 8;
    const POOL = 9;          // cards rendered per half (centre ± 4)
    const WIN = Math.floor(POOL / 2);
    const FORCE_MIN = 6;     // a forced spin travels at least this many cards
    const LONG_PRESS = 650;  // ms
    const NO_REPEAT = 14;    // no duplicate card within this many positions

    const stage = document.getElementById('stage');
    const flash = document.getElementById('flash');
    const guides = {
      top: document.querySelector('.top-guide'),
      bottom: document.querySelector('.bottom-guide'),
    };

    let cardW = 0, cardH = 0, spacing = 0, viewW = 0;
    let swipedSinceResult = false;
    let forceArmed = false;

    // Each half is an endless strip. Cards are dealt lazily per position and then
    // stay put, so scrolling back shows the same cards. A forced landing writes the
    // forced card into a position that hasn't been dealt yet.
    function makeHalf(el, name) {
      const half = { name, el, seq: new Map(), pos: 0, anim: null, drag: null, cards: [], dirty: true, rested: null };
      for (let k = 0; k < POOL; k++) {
        const c = document.createElement('div');
        c.className = 'card';
        c.dataset.idx = '';
        el.appendChild(c);
        half.cards.push(c);
      }
      return half;
    }

    function deal(h, i) {
      const near = new Set();
      for (let j = i - NO_REPEAT; j <= i + NO_REPEAT; j++) {
        if (h.seq.has(j)) near.add(h.seq.get(j));
      }
      let pool = ALL.filter(c => !near.has(c) && !(forceArmed && isForce(c)));
      if (!pool.length) pool = ALL;
      return pool[Math.floor(Math.random() * pool.length)];
    }

    function cardAt(h, i) {
      if (!h.seq.has(i)) h.seq.set(i, deal(h, i));
      return h.seq.get(i);
    }

    // Forget dealt cards that are off screen, so they can be re-dealt unnoticed.
    const onScreen = (h, i) => Math.abs(i - h.pos) * spacing - cardW / 2 < viewW / 2 + 4;
    function forgetOffscreen(h) {
      for (const i of [...h.seq.keys()]) if (!onScreen(h, i)) h.seq.delete(i);
    }

    const top = makeHalf(document.querySelector('.half.top'), 'top');
    const bottom = makeHalf(document.querySelector('.half.bottom'), 'bottom');
    const halves = [top, bottom];
    const partner = h => (h === top ? bottom : top);

    // Start on two different cards.
    top.seq.set(0, ALL[Math.floor(Math.random() * ALL.length)]);
    do { bottom.seq.set(0, ALL[Math.floor(Math.random() * ALL.length)]); }
    while (bottom.seq.get(0) === top.seq.get(0));
    top.rested = top.seq.get(0);
    bottom.rested = bottom.seq.get(0);

    const busy = h => !!(h.drag || h.anim);
    const current = h => cardAt(h, Math.round(h.pos));

    function layout() {
      viewW = window.innerWidth;
      const vh = window.innerHeight;
      cardW = Math.min(viewW * 0.7, (vh * 0.76) / 1.4, 380);
      cardH = cardW * 1.4;
      spacing = cardW * 0.98;
      halves.forEach(h => {
        h.el.style.height = `${cardH / 2}px`;
        h.cards.forEach(c => {
          c.style.width = `${cardW}px`;
          c.style.height = `${cardH / 2}px`;
          c.style.backgroundSize = `${cardW}px ${cardH}px`;
        });
        h.dirty = true;
      });
    }

    function render(h) {
      const base = Math.round(h.pos);
      for (let k = 0; k < POOL; k++) {
        const i = base + k - WIN;
        const c = h.cards[k];
        const name = cardAt(h, i);
        if (c.dataset.idx !== name) {
          c.dataset.idx = name;
          c.style.backgroundImage = `url("${src(name)}")`;
        }
        const d = i - h.pos;
        const ad = Math.min(Math.abs(d), 1.5);
        const x = viewW / 2 + d * spacing - cardW / 2;
        const s = 1 - 0.1 * Math.min(ad, 1);
        c.style.transform = `translate3d(${x}px,0,0) scale(${s})`;
        c.style.opacity = String(1 - 0.62 * Math.min(ad, 1) - 0.25 * Math.max(0, ad - 1));
      }
      h.dirty = false;
    }

    // ---------- Animation ----------
    function animateTo(h, target, duration, onDone) {
      h.anim = { from: h.pos, target, t0: performance.now(), duration, onDone };
    }

    function step(now) {
      halves.forEach(h => {
        if (h.anim) {
          const { from, target, t0, duration, onDone } = h.anim;
          const t = Math.min(1, (now - t0) / duration);
          h.pos = from + (target - from) * (1 - Math.pow(1 - t, POWER));
          h.dirty = true;
          if (t >= 1) {
            h.pos = target;
            h.anim = null;
            onDone && onDone();
          }
        }
        if (h.dirty) render(h);
      });
      requestAnimationFrame(step);
    }

    // ---------- Force ----------
    // Which forced card should half h land on next?
    // The card a half has settled on, or is spinning toward.
    const landing = h => (h.anim ? cardAt(h, h.anim.target) : h.rested);

    function nextForced(h) {
      const mine = h.rested;
      const theirs = landing(partner(h));
      const taken = isForce(theirs) ? theirs : null;
      // Alternate if already on a forced card; otherwise start on the 9♦.
      let pick = isForce(mine) ? otherForce(mine) : FORCE[0];
      // Never let both halves show the same forced card.
      if (pick === taken) pick = otherForce(pick);
      return pick;
    }

    function cue() {
      stage.classList.remove('cue');
      void stage.offsetWidth;
      stage.classList.add('cue');
      if (navigator.vibrate) navigator.vibrate(forceArmed ? 15 : [10, 60, 10]);
    }

    function toggleForce() {
      forceArmed = !forceArmed;
      cue();
    }

    // ---------- Result ----------
    function settled(h) {
      h.rested = current(h);
      if (!swipedSinceResult || halves.some(busy)) return;
      swipedSinceResult = false;
      showResult(current(top) === current(bottom));
    }

    function showResult(match) {
      flash.className = '';
      void flash.offsetWidth; // restart animation
      if (match) {
        flash.className = 'match show';
        flash.textContent = 'Match!';
        if (navigator.vibrate) navigator.vibrate([20, 40, 20]);
      } else {
        flash.className = 'miss show';
        flash.innerHTML = '<svg viewBox="0 0 40 40" aria-label="No match"><path d="M8 8l24 24M32 8 8 32"/></svg>';
      }
    }

    function hideResult() {
      flash.className = '';
    }

    // ---------- Input ----------
    function attach(h) {
      const el = h.el;

      el.addEventListener('pointerdown', e => {
        if (h.drag) return;
        el.setPointerCapture(e.pointerId);
        h.anim = null; // catch the carousel mid-spin
        h.drag = {
          id: e.pointerId,
          x0: e.clientX,
          pos0: h.pos,
          moved: 0,
          samples: [{ t: performance.now(), x: e.clientX }],
        };
        cancelIntro();
      });

      el.addEventListener('pointermove', e => {
        const d = h.drag;
        if (!d || e.pointerId !== d.id) return;
        const dx = e.clientX - d.x0;
        d.moved = Math.max(d.moved, Math.abs(dx));
        h.pos = d.pos0 - dx / spacing;
        h.dirty = true;
        const now = performance.now();
        d.samples.push({ t: now, x: e.clientX });
        while (d.samples.length > 2 && now - d.samples[0].t > 100) d.samples.shift();
        if (d.moved > TAP_PX) {
          hideResult();
          guides[h.name].classList.add('gone');
        }
      });

      const release = e => {
        const d = h.drag;
        if (!d || e.pointerId !== d.id) return;
        h.drag = null;

        // Velocity in cards per ms from the last ~100ms of movement.
        const now = performance.now();
        const recent = d.samples.filter(s => now - s.t < 100);
        let v = 0;
        if (recent.length >= 2) {
          const a = recent[0], b = recent[recent.length - 1];
          v = -((b.x - a.x) / Math.max(b.t - a.t, 1)) / spacing;
        }

        const isSwipe = d.moved > TAP_PX;
        if (!isSwipe) {
          animateTo(h, Math.round(h.pos), MIN_DUR, () => { h.rested = current(h); });
          return;
        }
        swipedSinceResult = true;

        const base = Math.round(h.pos);
        let target = Math.round(h.pos + v * FLING);

        if (forceArmed) {
          // Spin in the swipe direction, far enough that the landing spot is off
          // screen right now, then deal the forced card into that spot.
          const dir = Math.sign(v) || Math.sign(h.pos - d.pos0) || 1;
          const n = Math.max((target - base) * dir, FORCE_MIN);
          target = base + dir * n;
          const pick = nextForced(h);
          // Re-deal everything off screen (without the forced cards, so they
          // don't flash past on the way), then plant the forced card.
          forgetOffscreen(h);
          h.seq.set(target, pick);
        } else if (target === base && Math.abs(v) > 0.0015) {
          // A quick flick should always move at least one card.
          target += Math.sign(v);
        }

        const dist = Math.abs(target - h.pos);
        const speed = Math.max(Math.abs(v), forceArmed ? 0.004 : 0);
        let dur = speed > 0.0002 ? (POWER * dist) / speed : MIN_DUR;
        dur = Math.max(MIN_DUR, Math.min(MAX_DUR, dur));
        animateTo(h, target, dur, () => settled(h));
      };

      el.addEventListener('pointerup', release);
      el.addEventListener('pointercancel', release);
    }

    halves.forEach(attach);

    // Secret: a long press on the background (anywhere off the card strips)
    // toggles the force.
    let press = null;
    const endPress = e => {
      if (press && (!e || e.pointerId === press.id)) { clearTimeout(press.timer); press = null; }
    };
    document.addEventListener('pointerdown', e => {
      if (e.target.closest('.half') || press) return;
      press = {
        id: e.pointerId, x: e.clientX, y: e.clientY,
        timer: setTimeout(() => { press = null; toggleForce(); }, LONG_PRESS),
      };
    });
    document.addEventListener('pointermove', e => {
      if (press && e.pointerId === press.id &&
          Math.hypot(e.clientX - press.x, e.clientY - press.y) > TAP_PX) endPress(e);
    });
    document.addEventListener('pointerup', endPress);
    document.addEventListener('pointercancel', endPress);

    // ---------- Intro: a small peek to show each half moves ----------
    let introTimers = [];
    function peek(h, delay) {
      introTimers.push(setTimeout(() => {
        if (busy(h)) return;
        const start = h.pos;
        const t0 = performance.now();
        const wiggle = now => {
          if (h.drag || h.anim) return;
          const t = Math.min(1, (now - t0) / 1100);
          h.pos = start + 0.16 * Math.sin(Math.PI * 2 * t) * (1 - t);
          h.dirty = true;
          if (t < 1) requestAnimationFrame(wiggle); else { h.pos = start; h.dirty = true; }
        };
        requestAnimationFrame(wiggle);
      }, delay));
    }
    function cancelIntro() {
      introTimers.forEach(clearTimeout);
      introTimers = [];
    }

    window.addEventListener('resize', layout);
    document.addEventListener('gesturestart', e => e.preventDefault());
    document.addEventListener('contextmenu', e => e.preventDefault());

    layout();
    requestAnimationFrame(step);
    peek(top, 700);
    peek(bottom, 1300);
  })();
  </script>
</body>
</html>
